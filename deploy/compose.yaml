name: einvoice

# Local development only: the password below is not used anywhere else, and every port is
# bound to localhost.
services:
  dev:
    profiles: [core]
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace
      - hf-cache:/home/dev/.cache/huggingface
    environment:
      DATABASE_URL: postgresql://einvoice:einvoice@postgres:5432/einvoice
      VALIDATOR_URL: http://validator:8081
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_healthy

  postgres:
    profiles: [core]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: einvoice
      POSTGRES_PASSWORD: einvoice
      POSTGRES_DB: einvoice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "einvoice"]
      interval: 5s
      retries: 10

  validator:
    profiles: [core]
    build:
      context: docker
      dockerfile: validator.Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 5s
      start_period: 20s
      retries: 10

volumes:
  pgdata:
  hf-cache:
