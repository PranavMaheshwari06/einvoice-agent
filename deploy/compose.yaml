name: einvoice

# Local development only: the password below is not used anywhere else, and every port is
# bound to localhost.
services:
  dev:
    profiles: [core]
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspace
      - hf-cache:/home/dev/.cache/huggingface
    environment:
      DATABASE_URL: postgresql://einvoice:einvoice@postgres:5432/einvoice
      VALIDATOR_URL: http://validator:8081
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_healthy

  postgres:
    profiles: [core]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: einvoice
      POSTGRES_PASSWORD: einvoice
      POSTGRES_DB: einvoice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "einvoice"]
      interval: 5s
      retries: 10

  validator:
    profiles: [core]
    build:
      context: docker
      dockerfile: validator.Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 5s
      start_period: 20s
      retries: 10

  mlflow:
    profiles: [ml]
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    # MLflow 3.17 matches the Host header exactly (port included) and rejects other hosts.
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////home/dev/mlflow/mlflow.db
      --artifacts-destination /home/dev/mlflow/artifacts
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/home/dev/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      start_period: 20s
      retries: 10

volumes:
  pgdata:
  hf-cache:
  mlflow-data:
